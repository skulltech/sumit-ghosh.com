title: Sumit's Space
author:
  name: Sumit Ghosh
  email: sumit@sumit-ghosh.com
description: Sumit Ghosh — AI product engineering, document workflows, and production systems. CTO and technical cofounder of Jurisphere.
timezone: Asia/Kolkata
url: https://sumit-ghosh.com
baseurl: ""

minima:
  nav_pages:
    - work.md
    - writing.html
    - consulting.md
  social_links:
    - icon: x-twitter
      title: Sumit on X
      url: "https://x.com/summitkg"
    - icon: linkedin
      title: Sumit on LinkedIn
      url: "https://www.linkedin.com/in/summitkg/"
    - icon: github
      title: Sumit on GitHub
      url: "https://github.com/skulltech"
  skin: auto

remote_theme: jekyll/minima

include:
  - _redirects

exclude:
  - CNAME
  - Gemfile
  - LICENSE
  - README.md
  - vendor
  - editorial

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

permalink: /posts/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

google_analytics: UA-107859389-1
